configuration:
  url:
    name: URL
    description: Dashboard URL used when the pages list is empty. Use the kiosk version if available.
  pages:
    name: Pages
    description: Dashboards to record in sequence. Each entry generates its own HTML player and recording. Leave empty to use the single dashboard URL.
    fields:
      name:
        name: Page name
        description: Unique filename using lowercase letters, numbers, hyphens or underscores, starting with a letter or number.
      url:
        name: Dashboard URL
        description: Full URL of the Home Assistant dashboard to record.
  token:
    name: Token
    description: Access token for Home Assistant (optional). If not provided, the app will try to use the add-on's token.
  width:
    name: Width
    description: Width of the captured dashboard in pixels.
  height:
    name: Height
    description: Height of the captured dashboard in pixels.
  zoom:
    name: Zoom
    description: Zoom level for the dashboard.
  screencast_quality:
    name: Screencast quality
    description: JPEG quality used while capturing. Lower values reduce CPU usage and temporary file size.
  duration:
    name: Duration
    description: Duration of the capture in seconds.
  wait_until_loaded:
    name: Wait until HA loaded
    description: Wait for Home Assistant to finish loading before recording, preventing the loading screen from being captured.
  delay_after_loaded:
    name: Delay after HA loaded
    description: Additional delay in seconds after Home Assistant loads, allowing the dashboard splash screen to disappear.
  retain_profile:
    name: Retain Chromium profile
    description: Keep Chromium cache, cookies, local storage, and service-worker data between captures.
  profile_cache_clear_interval:
    name: Profile cache clear interval
    description: Clear Chromium's HTTP cache after this many minutes. Set to 0 to disable automatic clearing.
  cron:
    name: Cron
    description: Cron expression to schedule the capture.
  output_type:
    name: Output Type
    description: Type of the output file. Current supported types are 'webp' and 'mp4'.
  mp4_preset:
    name: MP4 encoding preset
    description: FFmpeg x264 preset. Faster presets reduce CPU usage but produce larger files.
  framerate:
    name: Framerate
    description: Framerate of the output file.
  encoder_threads:
    name: Encoder threads
    description: Maximum number of FFmpeg encoder threads. One reduces CPU usage; higher values encode faster.
  output_path:
    name: Output Path
    description: Output filename without an extension. When pages are configured, its directory is used and filenames come from page names.
